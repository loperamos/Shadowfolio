# Self-hosting Shadowfolio (e.g. on a Raspberry Pi): the app, and Cloudflare's tunnel publishing it on your domain.
#   docker compose up -d --build                    the app alone, at http://127.0.0.1:8080 on this machine
#   docker compose --profile public up -d --build   and the tunnel: live at your domain (see the README to create it)
# See the README's "Self-hosting" section.

services:
  app:
    build: .
    image: shadowfolio:latest
    env_file: .env
    # The container's own, over the development values in .env: its data lives in the volume, apart from the
    # development servers' database.
    environment:
      SHADOWFOLIO_HOST: 0.0.0.0
      SHADOWFOLIO_PORT: "8000"
      SHADOWFOLIO_DB: /data/shadowfolio.db
      SHADOWFOLIO_WEB_DIR: /app/web
      # It runs the daily sync and fills due orders itself (no timer outside it).
      SHADOWFOLIO_RUN_JOBS: "true"
    volumes:
      - shadowfolio-data:/data
    # To try it on this machine only; the public way in is the tunnel, which reaches the app inside Docker's network.
    ports:
      - "127.0.0.1:8080:8000"
    restart: unless-stopped

  # A tunnel created from the command line: its config.yml and credentials file (a secret) are read from
  # CLOUDFLARED_DIR (default ~/.cloudflared), as the user who owns them (CLOUDFLARED_USER, default 1000:1000).
  cloudflared:
    image: cloudflare/cloudflared:2026.10.1
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    user: ${CLOUDFLARED_USER:-1000:1000}
    volumes:
      - ${CLOUDFLARED_DIR:-~/.cloudflared}:/etc/cloudflared:ro
    depends_on:
      - app
    restart: unless-stopped
    # Only with --profile public, so nothing goes public by accident.
    profiles:
      - public

volumes:
  shadowfolio-data:
