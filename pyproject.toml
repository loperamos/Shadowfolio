[project]
name = "shadowfolio"
version = "0.1.0"
description = "Simulated investing wallets priced from real market data."
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "httpx2",
    "mcp>=2.3.0",
    "pyjwt[crypto]>=2.15.1",
    "python-dotenv",
    "uvicorn",
]

[project.scripts]
shadowfolio = "shadowfolio.main:main"

[dependency-groups]
dev = [
    "mypy",
    "playwright==1.64.1",
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests marked live call real services; they only run when asked for with `-m live`.
addopts = ["--strict-markers", "-m", "not live"]
markers = ["live: calls a real external service; needs credentials and network"]

[tool.ruff]
line-length = 140
target-version = "py313"

[tool.ruff.format]
# Collapse wrapped calls back onto one line whenever they fit.
skip-magic-trailing-comma = true

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DTZ"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]
