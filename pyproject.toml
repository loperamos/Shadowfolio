[project]
name = "shadowfolio"
version = "0.1.0"
description = "Simulated investing wallets priced from real market data."
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "python-dotenv",
    "uvicorn",
]

[project.scripts]
shadowfolio = "shadowfolio.main:main"

[dependency-groups]
dev = [
    "httpx2",
    "mypy",
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DTZ"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]
